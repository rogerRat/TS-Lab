# End-to-end smoke config: every step on real data with tiny budgets.
batch: smoke-0911-epochs

steps: [main, mechanism1, mechanism2, ablation, data-curve, time-curve]

context_length: 512
prediction_length: 64
pool_stride: 1

cover_density: 0.02
error_density: 0.02
split_density: 0.005

block_budget: 8
mean_epsilon: 0.70388913
endpoint_epsilon: 0.70388913
curvature_cap: 1.0

datasets: [ETT_1H]
series_cap: 2
n_windows: 16
pool_equivalents: 128
pool_seed: 0

model_path: null
projection_dimension: 4096

source_epochs: 4
students: [chronos-small]
student_parallelism: 1
train_batch: 8
learning_rate: 1.0e-5
seeds: [0]

with_baselines: [less, tsds, lp_mirror, ltsv]
less_pool_stride: 16

variants: [full, no_error]
with_grid: true

n_values: [8, 16]
total_budget_seconds: 120

densities: [0.05, 0.10]
b_values: [1, 4]
m_values: [50]

density: 0.05
cancel_ratio: 0.5

step_overrides:
  mechanism1:
    dataset: ETT_1H
    series_cap: 2
    slice_length: 2048
    pool_series: 2
    pool_slice: 2048
    stride: 1
    projection_dimension: 1024
    rescan: false
  mechanism2:
    scan_dir: "{run_dir}/mechanism1"
    stride: 1
  data-curve:
    dataset: ETT_1H
    arms: [rags, random, trajectory_level]
  time-curve:
    dataset: ETT_1H
    arms: [rags, random]
  ablation:
    dataset: ETT_1H
